<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech Store</title>

  <style>





 

    /* ============================================================
       ФУТЕР
       ============================================================ */

  </style>
</head>
<body>

  <!-- ============================ ХЕДЕР ============================ -->
  

  <main class="page">
    

      <!-- ==================== СТРАНИЦА: ГЛАВНАЯ ==================== -->
      

      <!-- ==================== СТРАНИЦА: КАТАЛОГ ==================== -->
      

      <!-- ==================== СТРАНИЦА: КОНТАКТЫ ==================== -->
      

  </main>

  <!-- ============================ ФУТЕР ============================ -->


  <script>
    /* ============================================================
       1. РОУТЕР (на хешах — чтобы не поднимать сервер под HTML)
       ============================================================ */
    const routes = {
      '/':       { el: 'page-home',     title: 'Tech Store — главная' },
      '/catalog':{ el: 'page-catalog',  title: 'Каталог — Tech Store' },
      '/contacts':{el: 'page-contacts', title: 'Контакты — Tech Store' },
    };

    function renderRoute() {
      const hash = location.hash.replace(/^#/, '') || '/';
      const route = routes[hash] || routes['/'];

      // скрываем все страницы, показываем нужную
      document.querySelectorAll('.page[id^="page-"]').forEach(el => el.hidden = true);
      document.getElementById(route.el).hidden = false;

      // метатег title
      document.title = route.title;

      // активный пункт меню
      document.querySelectorAll('.nav__link').forEach(a => {
        a.classList.toggle('is-active', a.getAttribute('href') === '#' + hash);
      });

      // скролл наверх
      window.scrollTo({ top: 0, behavior: 'instant' });

      // ленивая загрузка данных под страницу
      if (hash === '/catalog') loadProducts();
    }

    window.addEventListener('hashchange', renderRoute);

    /* ============================================================
       2. КАТАЛОГ — шаблон под получение с бэкенда
       ============================================================ */

    // ЗАГЛУШКА. Здесь будет fetch/axios к FastAPI.
    // Сейчас возвращаем фейковые данные, чтобы ты видел верстку.
    async function fetchProducts() {
      // --- РЕАЛЬНЫЙ ВАРИАНТ (раскомментируй, когда будет бэкенд) ---
      // const res = await fetch('http://localhost:8000/products');
      // if (!res.ok) throw new Error('Не удалось загрузить товары');
      // return await res.json();

      // --- ФЕЙК (эмуляция задержки сети) ---
      await new Promise(r => setTimeout(r, 600));
      return [
        { id: 1, name: 'Смартфон Galaxy X',  description: '6.5", 128 ГБ, камера 50 Мп', price: 49990, image: '' },
        { id: 2, name: 'Ноутбук UltraBook',  description: '14", 16 ГБ RAM, 512 ГБ SSD', price: 89990, image: '' },
        { id: 3, name: 'Наушники AirSound',  description: 'Беспроводные, шумоподавление', price: 12990, image: '' },
        { id: 4, name: 'Планшет Tab Lite',   description: '10.1", 64 ГБ, Wi-Fi',        price: 24990, image: '' },
        { id: 5, name: 'Умные часы FitPro',  description: 'GPS, пульсометр, 7 дней',    price: 15990, image: '' },
        { id: 6, name: 'Клавиатура Mech K2', description: 'Механическая, RGB',          price: 6990,  image: '' },
      ];
    }

    let allProducts = [];       // сырые данные с бэка
    let productsLoaded = false; // чтобы не грузить повторно при каждом переходе

    async function loadProducts() {
      if (productsLoaded) return;

      const grid = document.getElementById('catalogGrid');
      const status = document.getElementById('catalogStatus');

      // скелетоны на время загрузки
      grid.innerHTML = Array.from({ length: 6 }).map(() =>
        '<div class="skeleton"></div>'
      ).join('');
      status.className = 'form__status';
      status.textContent = '';

      try {
        allProducts = await fetchProducts();
        productsLoaded = true;
        applyFiltersAndRender();
      } catch (err) {
        grid.innerHTML = '';
        status.className = 'form__status is-error';
        status.textContent = 'Ошибка загрузки: ' + err.message;
      }
    }

    function applyFiltersAndRender() {
      const query = document.getElementById('catalogSearch').value.trim().toLowerCase();
      const sort = document.getElementById('catalogSort').value;

      let list = allProducts.filter(p =>
        p.name.toLowerCase().includes(query) ||
        (p.description || '').toLowerCase().includes(query)
      );

      if (sort === 'price-asc')  list.sort((a, b) => a.price - b.price);
      if (sort === 'price-desc') list.sort((a, b) => b.price - a.price);
      if (sort === 'name-asc')   list.sort((a, b) => a.name.localeCompare(b.name, 'ru'));

      renderProducts(list);
    }

    function renderProducts(list) {
      const grid = document.getElementById('catalogGrid');

      if (!list.length) {
        grid.innerHTML = '<div class="empty" style="grid-column: 1 / -1;">Ничего не найдено</div>';
        return;
      }

      grid.innerHTML = list.map(p => `
        <article class="product-card" data-id="${p.id}">
          <div class="product-card__image">
            ${p.image
              ? `<img src="${p.image}" alt="${escapeHtml(p.name)}" />`
              : 'нет изображения'}
          </div>
          <div class="product-card__body">
            <h3 class="product-card__name">${escapeHtml(p.name)}</h3>
            <p class="product-card__desc">${escapeHtml(p.description || '')}</p>
            <div class="product-card__footer">
              <span class="product-card__price">${formatPrice(p.price)}</span>
              <button class="product-card__btn" data-add="${p.id}">В корзину</button>
            </div>
          </div>
        </article>
      `).join('');
    }

    // поиск/сортировка (делегирование событий)
    document.getElementById('catalogSearch').addEventListener('input', applyFiltersAndRender);
    document.getElementById('catalogSort').addEventListener('change', applyFiltersAndRender);

    // клик по «В корзину» — пока просто лог, потом сюда придёт логика
    document.getElementById('catalogGrid').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-add]');
      if (!btn) return;
      const id = Number(btn.dataset.add);
      console.log('Добавить в корзину товар id =', id);
      // TODO: тут будет store.addToCart(id) или запрос к бэкенду
    });

    /* ============================================================
       3. КОНТАКТЫ — валидация + шаблон отправки на бэкенд
       ============================================================ */

    const contactForm = document.getElementById('contactForm');
    const contactStatus = document.getElementById('contactStatus');
    const contactSubmit = document.getElementById('contactSubmit');

    function validateContactForm(data) {
      const errors = {};

      if (!data.name || data.name.trim().length < 2) {
        errors.name = 'Введите имя (минимум 2 символа)';
      }

      // простая проверка email
      const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!data.email || !emailRe.test(data.email)) {
        errors.email = 'Введите корректный email';
      }

      if (!data.message || data.message.trim().length < 10) {
        errors.message = 'Сообщение должно быть не короче 10 символов';
      }

      return errors;
    }

    function showFieldErrors(errors) {
      document.querySelectorAll('[data-error-for]').forEach(el => {
        el.textContent = errors[el.dataset.errorFor] || '';
      });
    }

    contactForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(contactForm);
      const data = {
        name: formData.get('name')?.toString().trim() || '',
        email: formData.get('email')?.toString().trim() || '',
        subject: formData.get('subject')?.toString().trim() || '',
        message: formData.get('message')?.toString().trim() || '',
      };

      // 1. Валидация на клиенте
      const errors = validateContactForm(data);
      showFieldErrors(errors);
      if (Object.keys(errors).length) return;

      // 2. Сброс статуса и блокировка кнопки
      contactStatus.className = 'form__status';
      contactStatus.textContent = '';
      contactSubmit.disabled = true;
      contactSubmit.textContent = 'Отправка...';

      try {
        // --- РЕАЛЬНЫЙ ВАРИАНТ (раскомментируй, когда будет бэкенд) ---
        // const res = await fetch('http://localhost:8000/contacts', {
        //   method: 'POST',
        //   headers: { 'Content-Type': 'application/json' },
        //   body: JSON.stringify(data),
        // });
        // if (!res.ok) throw new Error('Сервер вернул ошибку ' + res.status);
        // const json = await res.json();

        // --- ФЕЙК (эмуляция успешной отправки) ---
        await new Promise(r => setTimeout(r, 800));
        console.log('Отправлено на сервер:', data);

        // 3. Успех
        contactStatus.className = 'form__status is-success';
        contactStatus.textContent = 'Спасибо! Мы свяжемся с вами в ближайшее время.';
        contactForm.reset();
      } catch (err) {
        contactStatus.className = 'form__status is-error';
        contactStatus.textContent = 'Не удалось отправить: ' + err.message;
      } finally {
        contactSubmit.disabled = false;
        contactSubmit.textContent = 'Отправить';
      }
    });

    /* ============================================================
       4. УТИЛИТЫ
       ============================================================ */
    function formatPrice(value) {
      return new Intl.NumberFormat('ru-RU', {
        style: 'currency',
        currency: 'RUB',
        maximumFractionDigits: 0,
      }).format(value);
    }

    // защита от XSS при вставке данных с бэкенда в innerHTML
    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    /* ============================================================
       5. СТАРТ
       ============================================================ */
    renderRoute();
  </script>
</body>
</html>
